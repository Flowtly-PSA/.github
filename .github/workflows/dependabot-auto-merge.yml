# Reusable: enable auto-merge (squash) on Dependabot minor and patch updates, and on every
# non-draft pull request a trusted author (write access or more, read live) opens from a branch of the
# same repository, except steward/* branches and promotions (a `preprod` or `promote/*` head,
# which /flowtly:release merges as a merge commit). It arms only after every workflow run on the
# head has finished with no failed, cancelled or timed-out job, because GitHub's auto-merge waits for
# required checks only. Converting a pull request to draft disables its auto-merge. Every setting
# lives here; callers only wire the pull_request event. See WORKFLOWS.md.
# The file keeps its old name because every caller and the `auto-merge / auto-merge` check use it.
name: Auto-merge

on:
  workflow_call:
    inputs:
      runner-labels:
        description: 'JSON runner label array. Defaults to the isolated org merge-control pool; a public caller must pass ["ubuntu-latest"] (never run public-repo code on our runners).'
        type: string
        required: false
        default: '["self-hosted","Linux","X64","ci-control-merge"]'

permissions:
  contents: write
  pull-requests: write
  # Reads the workflow runs and jobs on the head before arming, and dispatches the deploy after the
  # merge (below). A caller that grants only the two scopes above gets no auto-merge: the read
  # fails and nothing is armed.
  actions: write

jobs:
  auto-merge:
    # Two paths. Dependabot: unchanged. Trusted author: the pull request's author, not
    # github.actor, because a push by someone else changes the actor but not who opened it. Trust
    # is the author's live permission on the repository, read in the step below, not the payload's
    # author_association, which did not show the trust REST showed: the owner, whose org
    # membership is private and who is MEMBER over REST, had the path skipped in every repository
    # where he is not a direct collaborator (flowtly-plugin#214). A bot author never qualifies. A fork
    # head never qualifies, and steward/* heads are left to steward, which merges them itself
    # (flowtly-orchestration#1456), and a preprod or promote/* head is a promotion that
    # /flowtly:release merges as a merge commit. converted_to_draft is admitted for any author so that
    # draft keeps meaning "do not merge".
    if: >-
      (github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false)
      || (github.event.pull_request.head.repo.full_name == github.repository
          && !startsWith(github.event.pull_request.head.ref, 'steward/')
          && github.event.pull_request.head.ref != 'preprod'
          && !startsWith(github.event.pull_request.head.ref, 'promote/')
          && (github.event.action == 'converted_to_draft'
              || (github.event.pull_request.draft == false
                  && github.event.pull_request.user.type != 'Bot')))
    # Polling waits belong on the restricted merge-control pool, not the general
    # runners whose checks this job awaits. These API-only workers have gh,
    # Python 3 and PyYAML, and separate service memory/CPU limits.
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    # Most of this is waiting: for CI to finish before arming, then for the merge so the deploy can
    # follow it (see the last step). Each wait is bounded to about an hour.
    # Runner choice is controlled by the caller.
    timeout-minutes: 130
    concurrency:
      group: dependabot-auto-merge-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Whoever armed it (this workflow, the fleet, a person), a draft must not merge on ready.
      - name: Disable auto-merge on a draft
        if: github.event.action == 'converted_to_draft'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -n "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]; then
            gh pr merge --disable-auto "$PR_URL"
          else
            echo "Auto-merge was not enabled; nothing to disable."
          fi

      - id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # update-type is the highest semver change in the pull request, so a grouped pull request
      # qualifies only when every update in it is minor or patch. A security update qualifies on
      # the same terms; a semver-major one, or one with no semver update-type, never does.
      - name: Enable auto-merge
        id: enable
        if: github.event.action != 'converted_to_draft'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Trusted path: the author must hold write, maintain or admin on this repository now,
          # however it was granted (direct, team, org base permission). A user with no access reads
          # as 'none'; any API failure fails the step, so nothing is armed and the failure shows.
          if [ "$DEPENDABOT" != true ]; then
            perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission)
            case "$perm" in
              admin|write) ;;
              *)
                echo "::notice::Skipping auto-merge: '$AUTHOR' has '$perm' permission on $REPO, not write."
                exit 0
                ;;
            esac
          fi

          if [ "$DEPENDABOT" = true ]; then
            case "$UPDATE_TYPE" in
              version-update:semver-minor|version-update:semver-patch) ;;
              *)
                echo "::notice::Skipping auto-merge: update-type is '${UPDATE_TYPE:-none}', only minor and patch updates are auto-merged."
                exit 0
                ;;
            esac
          fi

          # The event payload can be older than the pull request: never arm a draft, and disarm one
          # that a reordered run left armed.
          # Assigned first so that an API failure fails the step (set -e) instead of reading empty.
          live=$(gh pr view "$PR_URL" --json isDraft,autoMergeRequest \
            --jq '[.isDraft, (.autoMergeRequest != null)] | map(tostring) | join(" ")')
          read -r draft armed <<< "$live"
          if [ "$draft" = true ]; then
            [ "$armed" = true ] && gh pr merge --disable-auto "$PR_URL"
            echo "::notice::Skipping auto-merge: the pull request is a draft."
            exit 0
          fi

          # `gh pr merge --auto` on a branch with no required status check merges at once, before
          # CI has run. Refuse unless the base branch requires at least one check, through branch
          # protection or a ruleset. An API failure fails this step, so nothing is merged.
          protection=$(gh api "repos/$REPO/branches/$BASE" \
            --jq 'if .protection.required_status_checks.enforcement_level == "off" then 0
                  else (.protection.required_status_checks.contexts // [] | length) end')
          rulesets=$(gh api --paginate "repos/$REPO/rules/branches/$BASE" \
            --jq '.[] | select(.type == "required_status_checks")
                  | .parameters.required_status_checks | length' | awk '{ n += $1 } END { print n + 0 }')

          if [ "$protection" -eq 0 ] && [ "$rulesets" -eq 0 ]; then
            echo "::warning::Skipping auto-merge: '$BASE' has no required status check, so auto-merge would merge before CI."
            exit 0
          fi

          echo "Required checks on '$BASE': $protection from branch protection, $rulesets from rulesets."

          # A CI job skipped while the pull request was a draft reports success, which satisfies a
          # required check. On ready_for_review the PR can then be CLEAN before CI has run on it, and
          # auto-merge would merge at once. So on the trusted path, refuse that while any check on
          # the head is skipped; a later push arms it. Dependabot pull requests are never drafts.
          # Skipped jobs are counted through the Actions API: statusCheckRollup needs checks:read,
          # which callers do not grant, while their actions:write covers runs and jobs. Every call is
          # an assignment, so an API failure fails the step (set -e) and nothing is armed.
          if [ "$DEPENDABOT" != true ]; then
            live=$(gh pr view "$PR_URL" --json mergeStateStatus,headRefOid --jq '[.mergeStateStatus, .headRefOid] | join(" ")')
            read -r merge_state head_sha <<< "$live"
            skipped=0
            # gh merges at once, not on CI, in any of these three states.
            if [[ "$merge_state" =~ ^(CLEAN|HAS_HOOKS|UNSTABLE)$ ]]; then
              runs=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$head_sha&per_page=100" --jq '.workflow_runs[].id')
              for run in $runs; do
                n=$(gh api --paginate "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" \
                  --jq '[.jobs[] | select(.conclusion == "skipped")] | length' | awk '{ s += $1 } END { print s + 0 }')
                skipped=$((skipped + n))
              done
            fi
            if [ "$skipped" -gt 0 ]; then
              echo "::warning::Skipping auto-merge: mergeable now with $skipped skipped check(s), so CI may not have run on this head. Push again to arm it."
              exit 0
            fi
          fi

          # GitHub's auto-merge waits only for REQUIRED checks: any other check that fails after it
          # is armed does not stop the merge (the hole flowtly-plugin#214, merged by hand with a red
          # non-required check, brought to light). So on both paths, arm only once every workflow run on the head has completed and
          # no job failed, was cancelled or timed out, as steward's merge.py refuses a red check. Each
          # workflow is judged per event by its newest run that did not skip outright, at its latest
          # attempt, so a draft-era skip, a run superseded by a newer one, or a re-run attempt is not
          # the verdict; a push run and a pull_request run of one workflow are both judged. This
          # workflow's own runs are left out. A red run ends the wait at once.
          # Commit statuses and other apps' check runs are not seen (callers grant no checks:read).
          # Every call is an assignment, so an API failure fails the step and nothing is armed. A
          # push, a draft conversion or a reopen cancels this wait (concurrency above).
          [ -n "${head_sha:-}" ] || head_sha=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          self_wf=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          # Done when nothing is running in two polls in a row with the same runs, so a run created a
          # moment late (a workflow_run follow-up) is still waited for.
          bad='^(failure|cancelled|timed_out|startup_failure|action_required)$'
          prev="-"
          deadline=$((SECONDS + 60 * 60))
          while :; do
            runs=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$head_sha&per_page=100" \
              --jq ".workflow_runs[] | select(.workflow_id != $self_wf)
                    | [.id, .status, (.conclusion // \"\"), \"\(.workflow_id) \(.event)\", .created_at, .name] | @tsv")
            # The verdict runs: per workflow and event, the newest one that did not skip outright.
            judged=$(jq -nRr '[inputs | split("\t") | select(length == 6)
                | {id: (.[0] | tonumber), s: .[1], c: .[2], k: .[3], at: .[4], n: .[5]}]
              | group_by(.k) | map(map(select(.c != "skipped")) | max_by([.at, .id]) // empty)
              | .[] | [.id, .s, .c, .n] | @tsv' <<< "$runs")
            ids=$(awk '{ print $1 }' <<< "$runs" | sort)
            red=$(awk -F '\t' -v bad="$bad" '$3 ~ bad { printf "%s (%s); ", $4, $3 }' <<< "$judged")
            [ -n "$red" ] && break
            if [ -z "$(awk 'NF && $2 != "completed"' <<< "$runs")" ]; then
              [ "$ids" = "$prev" ] && break
              prev=$ids
            else
              prev="-"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::Skipping auto-merge: CI on $head_sha did not finish within an hour. Push again to retry, or merge by hand."
              exit 0
            fi
            sleep 30
          done
          if [ -z "$ids" ]; then
            echo "::warning::Skipping auto-merge: no workflow ran on $head_sha, so there is no CI result to arm on."
            exit 0
          fi
          # Every job of a verdict run, at its latest attempt: a job that failed under
          # continue-on-error leaves its run green but its check red.
          if [ -z "$red" ]; then
            run_ids=$(awk '{ print $1 }' <<< "$judged")
            for run in $run_ids; do
              red+=$(gh api --paginate "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" \
                --jq '[.jobs[] | select(.conclusion // "" | test("^(failure|cancelled|timed_out)$"))
                       | "\(.name) (\(.conclusion)); "] | join("")')
            done
          fi
          if [ -n "$red" ]; then
            echo "::warning::Skipping auto-merge: a check on $head_sha did not pass: ${red%; }. Fix it and push, or merge by hand; a re-run does not re-arm."
            exit 0
          fi
          # The wait can be long: arm only a pull request that is still open and ready.
          live=$(gh pr view "$PR_URL" --json state,isDraft --jq '[.state, .isDraft] | map(tostring) | join(" ")')
          read -r state draft <<< "$live"
          if [ "$state" != OPEN ] || [ "$draft" = true ]; then
            echo "::notice::Skipping auto-merge: the pull request is no longer open and ready ($state, draft $draft)."
            exit 0
          fi

          # Pin the head that was checked: a push in between fails this step.
          gh pr merge --auto --squash ${head_sha:+--match-head-commit "$head_sha"} "$PR_URL"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # THE MERGE ABOVE SHIPS NOTHING ON ITS OWN (flowtly-orchestration#947). Auto-merge was enabled
      # with GITHUB_TOKEN, so the merge is made by github-actions[bot], and GitHub creates no workflow
      # run for a push made that way. The default branch moves, no deploy runs, production never gets
      # the commit, and the merge gate then refuses every later pull request in the repository.
      #
      # workflow_dispatch IS an exception to that recursion guard (probed 2026-10-01: assetly.pl run
      # 36829156165, event workflow_dispatch, triggering_actor github-actions[bot]). So this step waits
      # for the merge and dispatches each workflow that the push WOULD have triggered, at the branch
      # ref (never a re-run, which would replay an older tree). That includes CI, not only deploys: a
      # deploy that gates on the CI check-run of its commit fails when CI never ran there
      # (Flowtly-PSA/.github#14), so CI workflows are dispatched first and deploy-named ones last.
      #
      # The `closed` event cannot carry this: it comes from the same GITHUB_TOKEN merge, so it is
      # suppressed the same way, and callers do not subscribe to it. The job that asked for the merge
      # is the only thing guaranteed to be around when it happens.
      #
      # It never fails the job once the merge has happened. Anything it cannot decide is a warning, and
      # ~/bin/deploy-dispatch.sh on the fleet remains the backstop for a HEAD with no deploy run.
      - name: Deploy after the merge
        if: steps.enable.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # The push rule, written once so the check before the wait and the dispatch after the merge
          # apply the same one. Prints TRIGGERS / IGNORED / UNKNOWN <why>, then DISPATCHABLE or
          # NOT_DISPATCHABLE.
          work=$(mktemp -d)
          cat > "$work/eval.py" <<'PY'
          import re, sys, yaml
          branch, wf, changed = sys.argv[1], sys.argv[2], open(sys.argv[3]).read().split()
          def out(v, d=False):
              print(v); print("DISPATCHABLE" if d else "NOT_DISPATCHABLE"); sys.exit(0)
          def rx(p):
              if any(c in p for c in "![]+"): return None
              p = p.replace("**/", "\0"); o = []; i = 0
              while i < len(p):
                  c = p[i]
                  if c == "\0": o.append("(?:.*/)?")
                  elif c == "*":
                      if p[i+1:i+2] == "*": o.append(".*"); i += 1
                      else: o.append("[^/]*")
                  elif c == "?": o.append("[^/]")
                  else: o.append(re.escape(c))
                  i += 1
              return "".join(o)
          def any_match(f, pats):
              unsup = False
              for p in pats:
                  r = rx(str(p))
                  if r is None: unsup = True; continue
                  if re.fullmatch(r, f): return True
              return None if unsup else False
          try: doc = yaml.safe_load(open(wf))
          except Exception: out("UNKNOWN unparseable")
          if not isinstance(doc, dict): out("UNKNOWN not a mapping")
          on = doc.get("on", doc.get(True))
          if isinstance(on, str): on = {on: None}
          if isinstance(on, list): on = {k: None for k in on}
          if not isinstance(on, dict) or "push" not in on: out("IGNORED")
          disp = "workflow_dispatch" in on
          push = on.get("push")
          if not isinstance(push, dict): out("TRIGGERS", disp)
          if push.get("branches-ignore") is not None or push.get("tags") is not None and push.get("branches") is None:
              out("UNKNOWN branch filter", disp)
          br = push.get("branches")
          if br is not None:
              hit = False
              for b in br:
                  r = rx(str(b))
                  if r is None: out("UNKNOWN branch pattern", disp)
                  if re.fullmatch(r, branch): hit = True
              if not hit: out("IGNORED", disp)
          paths, ign = push.get("paths"), push.get("paths-ignore")
          if paths is not None:
              for f in changed:
                  m = any_match(f, paths)
                  if m is None: out("UNKNOWN paths pattern", disp)
                  if m: out("TRIGGERS", disp)
              out("IGNORED", disp)
          if ign is not None:
              for f in changed:
                  m = any_match(f, ign)
                  if m is None: out("UNKNOWN paths-ignore pattern", disp)
                  if not m: out("TRIGGERS", disp)
              out("IGNORED", disp)
          out("TRIGGERS", disp)
          PY

          # Waiting holds a billed runner until the merge, so wait only when a deploy workflow would
          # run: the rule below, on this pull request's files, at the base and at the head. Anything
          # it cannot read or decide counts as "would run". A pull request that deploys nothing gets
          # no CI dispatch either: CI on the default branch matters here only to a deploy gated on it.
          due_deploy() {
            local ref=$1 wf
            gh api "repos/$REPO/contents/.github/workflows?ref=$ref" --jq '.[] | select(.type == "file") | .name' > "$work/pre" \
              || { echo "?"; return; }
            while read -r wf; do
              case "$wf" in *.yml|*.yaml) ;; *) continue ;; esac
              case "$wf" in *deploy*|*publish*|*release*) ;; *) continue ;; esac
              gh api "repos/$REPO/contents/.github/workflows/$wf?ref=$ref" --jq .content | base64 -d > "$work/prewf" 2>/dev/null \
                || { echo "$wf"; continue; }
              [ "$(python3 "$work/eval.py" "$BASE" "$work/prewf" "$work/changed" | sed -n 1p)" = IGNORED ] || echo "$wf"
            done < "$work/pre"
          }
          if gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$work/changed"; then
            due=$(due_deploy "$BASE"; due_deploy "$HEAD_SHA")
            if [ -z "$due" ]; then
              echo "::notice::No deploy workflow would run on this merge; not waiting for it."
              exit 0
            fi
            echo "Waiting for the merge, because of: $(printf '%s\n' "$due" | sort -u | paste -sd' ')"
          fi

          # Wait for the merge. A later push to the pull request cancels this run (concurrency
          # above), and the run that replaces it waits instead.
          merged_sha=""
          for _ in $(seq 1 110); do
            read -r state merged_by sha < <(gh pr view "$PR_URL" --json state,mergedBy,mergeCommit \
              --jq '[.state, (.mergedBy.login // "-"), (.mergeCommit.oid // "-")] | join(" ")') || true
            case "${state:-}" in
              MERGED) merged_sha="$sha"; break ;;
              CLOSED) echo "::notice::Closed without merging; nothing to deploy."; exit 0 ;;
            esac
            sleep 30
          done
          if [ -z "$merged_sha" ]; then
            echo "::warning::Not merged within the wait; no deploy dispatched. The fleet's deploy-dispatch.sh covers a HEAD left without a deploy run."
            exit 0
          fi
          # Only a GITHUB_TOKEN merge suppresses the push run. A person or a merge queue merging it
          # produced a push run already, and dispatching again would deploy twice.
          case "$merged_by" in
            github-actions|github-actions\[bot\]|app/github-actions) ;;
            *) echo "::notice::Merged by '$merged_by', whose push creates its own deploy run; nothing to do."; exit 0 ;;
          esac
          echo "Merged as $merged_sha by $merged_by."

          head=$(gh api "repos/$REPO/branches/$BASE" --jq .commit.sha) || { echo "::warning::Could not read $BASE HEAD; no deploy dispatched."; exit 0; }
          if [ "$head" != "$merged_sha" ]; then
            echo "::notice::$BASE has moved past $merged_sha to $head; the commit that moved it owns the deploy."
            exit 0
          fi

          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$work/changed" \
            || { echo "::warning::Could not read the changed files; no deploy dispatched."; exit 0; }
          gh api "repos/$REPO/contents/.github/workflows?ref=$merged_sha" --jq '.[] | select(.type == "file") | .name' > "$work/workflows" \
            || { echo "::warning::Could not list workflows; no deploy dispatched."; exit 0; }

          # CI first, deploy-named last, so a deploy gate polling for its commit's CI check-run finds it
          # queued.
          { grep -Ev 'deploy|publish|release' "$work/workflows"; grep -E 'deploy|publish|release' "$work/workflows"; } > "$work/ordered"

          dispatched=0
          while read -r wf; do
            case "$wf" in *.yml|*.yaml) ;; *) continue ;; esac
            gh api "repos/$REPO/contents/.github/workflows/$wf?ref=$merged_sha" --jq .content | base64 -d > "$work/wf" 2>/dev/null || continue
            # Same rule GitHub applies to a push, computed at the merged commit. Prints
            # TRIGGERS / IGNORED / UNKNOWN <why>, then DISPATCHABLE or NOT_DISPATCHABLE.
            verdict=$(python3 "$work/eval.py" "$BASE" "$work/wf" "$work/changed") || verdict="UNKNOWN evaluator failed"
            due=$(printf '%s\n' "$verdict" | sed -n 1p)
            can=$(printf '%s\n' "$verdict" | sed -n 2p)
            [ "$due" = IGNORED ] && continue
            if [ "${due%% *}" = UNKNOWN ]; then
              echo "::warning::$wf: cannot tell whether the push would have run it (${due#UNKNOWN }); not dispatched."
              continue
            fi
            if [ "$can" != DISPATCHABLE ]; then
              case "$wf" in
                *deploy*|*publish*|*release*)
                  echo "::warning::$wf was due but declares no workflow_dispatch, so it cannot be started; $BASE is undeployed until it is. Add 'workflow_dispatch:' to its triggers." ;;
                *)
                  echo "::warning::$wf was due but declares no workflow_dispatch, so it cannot be started; $merged_sha has no run of it, and a deploy gated on it fails. Add 'workflow_dispatch:' to its triggers." ;;
              esac
              continue
            fi
            n=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$merged_sha" --jq .total_count 2>/dev/null || echo "?")
            if [ "$n" != 0 ]; then
              echo "::notice::$wf: ${n} run(s) already at $merged_sha (or unreadable); not dispatching."
              continue
            fi
            if gh workflow run "$wf" --repo "$REPO" --ref "$BASE"; then
              echo "Dispatched $wf at $BASE ($merged_sha)."
              dispatched=$((dispatched + 1))
            else
              echo "::warning::$wf: dispatch refused. If this is a 403, the caller must grant 'actions: write' (WORKFLOWS.md)."
            fi
          done < "$work/ordered"
          echo "Workflows dispatched: $dispatched."
