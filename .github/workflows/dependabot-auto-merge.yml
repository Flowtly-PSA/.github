# Reusable: enable auto-merge (squash) on Dependabot minor and patch updates, and on every
# non-draft pull request a trusted author (OWNER, MEMBER, COLLABORATOR) opens from a branch of the
# same repository, except steward/* branches. Converting a pull request to draft disables its
# auto-merge. Every setting lives here; callers only wire the pull_request event. See WORKFLOWS.md.
# The file keeps its old name because every caller and the `auto-merge / auto-merge` check use it.
name: Auto-merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  # Dispatches the deploy after the merge (below). A caller that grants only the two scopes above
  # still gets auto-merge; the dispatch then warns that it was refused and changes nothing.
  actions: write

jobs:
  auto-merge:
    # Two paths. Dependabot: unchanged. Trusted author: author_association, not github.actor,
    # because a push by someone else changes the actor but not who opened the pull request. A fork
    # head never qualifies, and steward/* heads are left to steward, which merges them itself
    # (flowtly-orchestration#1456). converted_to_draft is admitted on the same terms so that
    # draft keeps meaning "do not merge".
    if: >-
      (github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false)
      || (github.event.pull_request.head.repo.full_name == github.repository
          && !startsWith(github.event.pull_request.head.ref, 'steward/')
          && (github.event.action == 'converted_to_draft'
              || (github.event.pull_request.draft == false
                  && github.event.pull_request.user.login != 'dependabot[bot]'
                  && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))))
    # ubuntu-* rather than the self-hosted fleet: this job calls `gh`, which the fleet does not
    # ship (flowtly-global docs/RUNNERS.md, toolchain gaps). It runs for a few seconds.
    runs-on: ubuntu-latest
    # Most of this is waiting for the merge so the deploy can follow it (see the last step).
    # GitHub-hosted minutes, not the self-hosted fleet.
    timeout-minutes: 60
    concurrency:
      group: dependabot-auto-merge-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Whoever armed it (this workflow, the fleet, a person), a draft must not merge on ready.
      - name: Disable auto-merge on a draft
        if: github.event.action == 'converted_to_draft'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -n "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]; then
            gh pr merge --disable-auto "$PR_URL"
          else
            echo "Auto-merge was not enabled; nothing to disable."
          fi

      - id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # update-type is the highest semver change in the pull request, so a grouped pull request
      # qualifies only when every update in it is minor or patch. A security update qualifies on
      # the same terms; a semver-major one, or one with no semver update-type, never does.
      - name: Enable auto-merge
        id: enable
        if: github.event.action != 'converted_to_draft'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          set -euo pipefail

          if [ "$DEPENDABOT" = true ]; then
            case "$UPDATE_TYPE" in
              version-update:semver-minor|version-update:semver-patch) ;;
              *)
                echo "::notice::Skipping auto-merge: update-type is '${UPDATE_TYPE:-none}', only minor and patch updates are auto-merged."
                exit 0
                ;;
            esac
          fi

          # The event payload can be older than the pull request: never arm a draft, and disarm one
          # that a reordered run left armed.
          # Assigned first so that an API failure fails the step (set -e) instead of reading empty.
          live=$(gh pr view "$PR_URL" --json isDraft,autoMergeRequest \
            --jq '[.isDraft, (.autoMergeRequest != null)] | map(tostring) | join(" ")')
          read -r draft armed <<< "$live"
          if [ "$draft" = true ]; then
            [ "$armed" = true ] && gh pr merge --disable-auto "$PR_URL"
            echo "::notice::Skipping auto-merge: the pull request is a draft."
            exit 0
          fi

          # `gh pr merge --auto` on a branch with no required status check merges at once, before
          # CI has run. Refuse unless the base branch requires at least one check, through branch
          # protection or a ruleset. An API failure fails this step, so nothing is merged.
          protection=$(gh api "repos/$REPO/branches/$BASE" \
            --jq 'if .protection.required_status_checks.enforcement_level == "off" then 0
                  else (.protection.required_status_checks.contexts // [] | length) end')
          rulesets=$(gh api --paginate "repos/$REPO/rules/branches/$BASE" \
            --jq '.[] | select(.type == "required_status_checks")
                  | .parameters.required_status_checks | length' | awk '{ n += $1 } END { print n + 0 }')

          if [ "$protection" -eq 0 ] && [ "$rulesets" -eq 0 ]; then
            echo "::warning::Skipping auto-merge: '$BASE' has no required status check, so auto-merge would merge before CI."
            exit 0
          fi

          echo "Required checks on '$BASE': $protection from branch protection, $rulesets from rulesets."

          # A CI job skipped while the pull request was a draft reports success, which satisfies a
          # required check. On ready_for_review the PR can then be CLEAN before CI has run on it, and
          # auto-merge would merge at once. So on the trusted path, refuse that while any check on
          # the head is skipped; a later push arms it. Dependabot pull requests are never drafts.
          if [ "$DEPENDABOT" != true ]; then
            live=$(gh pr view "$PR_URL" --json mergeStateStatus,statusCheckRollup \
              --jq '[.mergeStateStatus, ([.statusCheckRollup[] | select(.conclusion == "SKIPPED")] | length | tostring)] | join(" ")')
            read -r merge_state skipped <<< "$live"
            # gh merges at once, not on CI, in any of these three states.
            if [[ "$merge_state" =~ ^(CLEAN|HAS_HOOKS|UNSTABLE)$ ]] && [ "$skipped" -gt 0 ]; then
              echo "::warning::Skipping auto-merge: mergeable now with $skipped skipped check(s), so CI may not have run on this head. Push again to arm it."
              exit 0
            fi
          fi
          gh pr merge --auto --squash "$PR_URL"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # THE MERGE ABOVE SHIPS NOTHING ON ITS OWN (flowtly-orchestration#947). Auto-merge was enabled
      # with GITHUB_TOKEN, so the merge is made by github-actions[bot], and GitHub creates no workflow
      # run for a push made that way. The default branch moves, no deploy runs, production never gets
      # the commit, and the merge gate then refuses every later pull request in the repository.
      #
      # workflow_dispatch IS an exception to that recursion guard (probed 2026-10-01: assetly.pl run
      # 36829156165, event workflow_dispatch, triggering_actor github-actions[bot]). So this step waits
      # for the merge and dispatches each deploy workflow that the push WOULD have triggered, at the
      # branch ref (never a re-run, which would replay an older tree).
      #
      # The `closed` event cannot carry this: it comes from the same GITHUB_TOKEN merge, so it is
      # suppressed the same way, and callers do not subscribe to it. The job that asked for the merge
      # is the only thing guaranteed to be around when it happens.
      #
      # It never fails the job once the merge has happened. Anything it cannot decide is a warning, and
      # ~/bin/deploy-dispatch.sh on the fleet remains the backstop for a HEAD with no deploy run.
      - name: Deploy after the merge
        if: steps.enable.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # Wait for the merge. A later push to the pull request cancels this run (concurrency
          # above), and the run that replaces it waits instead.
          merged_sha=""
          for _ in $(seq 1 110); do
            read -r state merged_by sha < <(gh pr view "$PR_URL" --json state,mergedBy,mergeCommit \
              --jq '[.state, (.mergedBy.login // "-"), (.mergeCommit.oid // "-")] | join(" ")') || true
            case "${state:-}" in
              MERGED) merged_sha="$sha"; break ;;
              CLOSED) echo "::notice::Closed without merging; nothing to deploy."; exit 0 ;;
            esac
            sleep 30
          done
          if [ -z "$merged_sha" ]; then
            echo "::warning::Not merged within the wait; no deploy dispatched. The fleet's deploy-dispatch.sh covers a HEAD left without a deploy run."
            exit 0
          fi
          # Only a GITHUB_TOKEN merge suppresses the push run. A person or a merge queue merging it
          # produced a push run already, and dispatching again would deploy twice.
          case "$merged_by" in
            github-actions|github-actions\[bot\]|app/github-actions) ;;
            *) echo "::notice::Merged by '$merged_by', whose push creates its own deploy run; nothing to do."; exit 0 ;;
          esac
          echo "Merged as $merged_sha by $merged_by."

          head=$(gh api "repos/$REPO/branches/$BASE" --jq .commit.sha) || { echo "::warning::Could not read $BASE HEAD; no deploy dispatched."; exit 0; }
          if [ "$head" != "$merged_sha" ]; then
            echo "::notice::$BASE has moved past $merged_sha to $head; the commit that moved it owns the deploy."
            exit 0
          fi

          work=$(mktemp -d)
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$work/changed" \
            || { echo "::warning::Could not read the changed files; no deploy dispatched."; exit 0; }
          gh api "repos/$REPO/contents/.github/workflows?ref=$merged_sha" --jq '.[] | select(.type == "file") | .name' > "$work/workflows" \
            || { echo "::warning::Could not list workflows; no deploy dispatched."; exit 0; }

          dispatched=0
          while read -r wf; do
            case "$wf" in *.yml|*.yaml) ;; *) continue ;; esac
            gh api "repos/$REPO/contents/.github/workflows/$wf?ref=$merged_sha" --jq .content | base64 -d > "$work/wf" 2>/dev/null || continue
            # Same rule GitHub applies to a push, computed at the merged commit. Prints
            # TRIGGERS / IGNORED / UNKNOWN <why>, then DISPATCHABLE or NOT_DISPATCHABLE.
            verdict=$(python3 - "$BASE" "$work/wf" "$work/changed" <<'PY'
          import re, sys, yaml
          branch, wf, changed = sys.argv[1], sys.argv[2], open(sys.argv[3]).read().split()
          def out(v, d=False):
              print(v); print("DISPATCHABLE" if d else "NOT_DISPATCHABLE"); sys.exit(0)
          def rx(p):
              if any(c in p for c in "![]+"): return None
              p = p.replace("**/", "\0"); o = []; i = 0
              while i < len(p):
                  c = p[i]
                  if c == "\0": o.append("(?:.*/)?")
                  elif c == "*":
                      if p[i+1:i+2] == "*": o.append(".*"); i += 1
                      else: o.append("[^/]*")
                  elif c == "?": o.append("[^/]")
                  else: o.append(re.escape(c))
                  i += 1
              return "".join(o)
          def any_match(f, pats):
              unsup = False
              for p in pats:
                  r = rx(str(p))
                  if r is None: unsup = True; continue
                  if re.fullmatch(r, f): return True
              return None if unsup else False
          try: doc = yaml.safe_load(open(wf))
          except Exception: out("UNKNOWN unparseable")
          if not isinstance(doc, dict): out("UNKNOWN not a mapping")
          on = doc.get("on", doc.get(True))
          if isinstance(on, str): on = {on: None}
          if isinstance(on, list): on = {k: None for k in on}
          if not isinstance(on, dict) or "push" not in on: out("IGNORED")
          disp = "workflow_dispatch" in on
          push = on.get("push")
          if not isinstance(push, dict): out("TRIGGERS", disp)
          if push.get("branches-ignore") is not None or push.get("tags") is not None and push.get("branches") is None:
              out("UNKNOWN branch filter", disp)
          br = push.get("branches")
          if br is not None:
              hit = False
              for b in br:
                  r = rx(str(b))
                  if r is None: out("UNKNOWN branch pattern", disp)
                  if re.fullmatch(r, branch): hit = True
              if not hit: out("IGNORED", disp)
          paths, ign = push.get("paths"), push.get("paths-ignore")
          if paths is not None:
              for f in changed:
                  m = any_match(f, paths)
                  if m is None: out("UNKNOWN paths pattern", disp)
                  if m: out("TRIGGERS", disp)
              out("IGNORED", disp)
          if ign is not None:
              for f in changed:
                  m = any_match(f, ign)
                  if m is None: out("UNKNOWN paths-ignore pattern", disp)
                  if not m: out("TRIGGERS", disp)
              out("IGNORED", disp)
          out("TRIGGERS", disp)
          PY
            ) || verdict="UNKNOWN evaluator failed"
            due=$(printf '%s\n' "$verdict" | sed -n 1p)
            can=$(printf '%s\n' "$verdict" | sed -n 2p)
            [ "$due" = IGNORED ] && continue
            if [ "${due%% *}" = UNKNOWN ]; then
              echo "::warning::$wf: cannot tell whether the push would have run it (${due#UNKNOWN }); not dispatched."
              continue
            fi
            # Every push-triggered workflow would have run, not only deploys, but only a deploy
            # leaves production behind; CI on the default branch is advisory here.
            case "$wf" in *deploy*|*publish*|*release*) ;; *) continue ;; esac
            if [ "$can" != DISPATCHABLE ]; then
              echo "::warning::$wf was due but declares no workflow_dispatch, so it cannot be started; $BASE is undeployed until it is. Add 'workflow_dispatch:' to its triggers."
              continue
            fi
            n=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$merged_sha" --jq .total_count 2>/dev/null || echo "?")
            if [ "$n" != 0 ]; then
              echo "::notice::$wf: ${n} run(s) already at $merged_sha (or unreadable); not dispatching."
              continue
            fi
            if gh workflow run "$wf" --repo "$REPO" --ref "$BASE"; then
              echo "Dispatched $wf at $BASE ($merged_sha)."
              dispatched=$((dispatched + 1))
            else
              echo "::warning::$wf: dispatch refused. If this is a 403, the caller must grant 'actions: write' (WORKFLOWS.md)."
            fi
          done < "$work/workflows"
          echo "Deploy workflows dispatched: $dispatched."
