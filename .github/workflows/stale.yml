name: Stale pull requests

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  stale:
    uses: Flowtly-PSA/.github/.github/workflows/stale-prs.yml@main
    with:
      # This repository is public: its code must never run on the org's own runners.
      runner-labels: '["ubuntu-latest"]'
    permissions:
      actions: write
      issues: write
      pull-requests: write
